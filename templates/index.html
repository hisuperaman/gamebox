{% extends 'base.html' %}

{% block title %}Home{% endblock title %}
{% block stylesheet %}
<link rel="stylesheet" href="{{url_for('static', filename='css/index.css')}}">
{% endblock stylesheet %}

{% block body %}
<div class="container text-center">
  <div class="row row-cols-2 row-cols-lg-5 g-2 g-lg-3">
    {% for game in games %}
    <div class="col" onclick="game_btn('{{ game.id }}')">
      <div class="p-3">
        <img src="{{ url_for(game.id ~ '.static', filename=game.thumbnail) }}" class="img-thumbnail" alt="{{ game.title }}">
        <h3>{{ game.title }}</h3>
      </div>
    </div>
    {% endfor %}
  </div>
</div>

<script src="{{url_for('static', filename='js/index.js')}}"></script>
{% endblock body %}
