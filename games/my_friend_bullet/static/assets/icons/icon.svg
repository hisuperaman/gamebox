<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2257"/>
      <stop offset="0.65" stop-color="#22163a"/>
      <stop offset="1" stop-color="#130d21"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.6" stop-color="#f6e7bd" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#f6e7bd" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="heart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b6b"/>
      <stop offset="1" stop-color="#c52c3c"/>
    </linearGradient>
    <linearGradient id="tracer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffe08a" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffe08a" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- night sky -->
  <rect width="512" height="512" fill="url(#sky)"/>

  <!-- city skyline -->
  <g fill="#2c1f47">
    <rect x="0" y="380" width="70" height="132"/>
    <rect x="62" y="340" width="58" height="172"/>
    <rect x="392" y="352" width="56" height="160"/>
    <rect x="442" y="318" width="70" height="194"/>
  </g>
  <g fill="#5b437f">
    <rect x="76" y="356" width="9" height="9"/><rect x="98" y="380" width="9" height="9"/>
    <rect x="456" y="336" width="9" height="9"/><rect x="480" y="360" width="9" height="9"/>
    <rect x="406" y="372" width="9" height="9"/><rect x="18" y="398" width="9" height="9"/>
  </g>
  <rect y="472" width="512" height="40" fill="#110b1c"/>
  <rect y="470" width="512" height="4" fill="#d79a3a"/>

  <!-- moon behind the scope -->
  <circle cx="256" cy="240" r="190" fill="url(#glow)"/>
  <circle cx="256" cy="240" r="128" fill="#f6e7bd"/>
  <circle cx="206" cy="196" r="16" fill="#eadaa9"/>
  <circle cx="300" cy="300" r="22" fill="#eadaa9"/>
  <circle cx="318" cy="188" r="10" fill="#eadaa9"/>

  <!-- tracer rounds -->
  <g stroke-linecap="round">
    <line x1="24" y1="96" x2="150" y2="122" stroke="url(#tracer)" stroke-width="5"/>
    <circle cx="152" cy="122" r="5" fill="#fff6d6"/>
    <line x1="360" y1="420" x2="488" y2="438" stroke="url(#tracer)" stroke-width="5"/>
    <circle cx="490" cy="438" r="5" fill="#fff6d6"/>
  </g>

  <!-- crosshair -->
  <g fill="none" stroke="#1b1230" stroke-linecap="round">
    <circle cx="256" cy="240" r="150" stroke-width="16"/>
    <circle cx="256" cy="240" r="96" stroke-width="7" opacity="0.5"/>
    <line x1="256" y1="66" x2="256" y2="152" stroke-width="16"/>
    <line x1="256" y1="328" x2="256" y2="414" stroke-width="16"/>
    <line x1="82" y1="240" x2="168" y2="240" stroke-width="16"/>
    <line x1="344" y1="240" x2="430" y2="240" stroke-width="16"/>
  </g>
  <g fill="none" stroke="#f4b93e" stroke-linecap="round">
    <circle cx="256" cy="240" r="150" stroke-width="8"/>
    <line x1="256" y1="70" x2="256" y2="148" stroke-width="8"/>
    <line x1="256" y1="332" x2="256" y2="410" stroke-width="8"/>
    <line x1="86" y1="240" x2="164" y2="240" stroke-width="8"/>
    <line x1="348" y1="240" x2="426" y2="240" stroke-width="8"/>
  </g>

  <!-- heart in the middle -->
  <path d="M256 290 C 200 254, 188 222, 200 204 C 214 182, 244 186, 256 210 C 268 186, 298 182, 312 204 C 324 222, 312 254, 256 290 Z"
        fill="url(#heart)" stroke="#1b1230" stroke-width="6" stroke-linejoin="round"/>
  <path d="M214 210 C 220 198, 234 198, 240 206" stroke="#ffb3b3" stroke-width="6" stroke-linecap="round" fill="none"/>
</svg>
