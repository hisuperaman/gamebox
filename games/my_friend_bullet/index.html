<!DOCTYPE html>
<html lang="en" class="tux-page">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="My Friend Bullet">
    <meta name="theme-color" content="#000000">
    <title>My Friend Bullet</title>
    <link rel="manifest" href="{{url_for('.static', filename='assets/manifest.json')}}">
    <link rel="apple-touch-icon" href="{{url_for('.static', filename='assets/icons/icon-192.png')}}">
    <link href="{{url_for('.static', filename='assets/icons/favicon-48.png')}}" rel="icon" type="image/png" sizes="48x48">

    <!-- everything is self-hosted (no CDNs) so the same page also works offline inside the android app -->
    <link rel="stylesheet" href="{{url_for('static', filename='vendor/fonts/fonts.css')}}">

    <!-- tux.js v1.0.0 by hisuperaman (built copy in static/vendor/tuxjs) -->
    <link rel="stylesheet" href="{{url_for('static', filename='vendor/tuxjs/tux.css')}}">
</head>

<!-- api-base: the leaderboard endpoints. The website uses its own server; the android build sets a full https:// url -->
<body data-sfx-path="{{url_for('.static', filename='assets/sfx/')}}"
      data-api-base="{{ api_base or '/api/my_friend_bullet' }}">

    <!-- tux.js + its two helpers: nipplejs (phone sticks), lucide (icons) -->
    <script src="{{url_for('static', filename='vendor/nipplejs/nipplejs.min.js')}}"></script>
    <script src="{{url_for('static', filename='vendor/lucide/lucide.min.js')}}"></script>
    <script src="{{url_for('static', filename='vendor/tuxjs/tux.js')}}"></script>

    <script src="{{url_for('.static', filename='js/rules.js')}}"></script>
    <script src="{{url_for('.static', filename='js/level.js')}}"></script>
    <script src="{{url_for('.static', filename='js/fighter.js')}}"></script>
    <script src="{{url_for('.static', filename='js/player.js')}}"></script>
    <script src="{{url_for('.static', filename='js/enemy.js')}}"></script>
    <script src="{{url_for('.static', filename='js/game.js')}}"></script>
    <script src="{{url_for('.static', filename='js/main.js')}}"></script>
</body>

</html>
